name: Deploy Clio

on:
  push:
    branches: [main]
  # 每天重建一次，让布告牌的过期规则真正生效。
  # 静态站只在构建时计算日期，没有这一步，超过存活期的便利贴会一直挂在墙上。
  # 16:00 UTC = 北京时间次日 00:00。
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  # 在网页上填一张表单就能发文，模板见 .github/ISSUE_TEMPLATE/publish.yml。
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 把 issue 表单变成一篇 Markdown，提交到 main。
  #
  # 发布和构建之所以要在同一次运行里做完：用 GITHUB_TOKEN 推送不会触发新的
  # push 工作流（GitHub 故意为之，防止工作流自我递归），所以「推完等下一次构建」
  # 这条路是不通的，只能这里推、这里紧接着构建。
  publish:
    # ★ 这个 if 里的第二行是整套部署里最要紧的一道闸：只有仓库主人自己开的
    # issue 才会被发布。
    #
    # 少了它会发生什么：本仓库是公开的，任何人在 Issues 里开一张标题以「[发布]」
    # 开头的 issue，这个 job 就会以 contents: write 的权限把 TA 写的正文提交进
    # main，一分钟后就出现在站上。等于把博客的写权限挂到了公网上——垃圾内容、
    # 广告链接、甚至一段能执行的 HTML 都能进仓库历史，之后只能手工 revert。
    #
    # 别指望 issue 表单本身能拦：config.yml 里的 blank_issues_enabled 只是隐藏
    # 「空白 issue」那个入口，直接访问 /issues/new?title=…&body=… 照样能提交自由
    # 格式的 issue，一样会触发 issues 事件。
    #
    # 所以判据只能是 github.event.issue.user.login——它由 GitHub 在服务端填好，
    # 是认证过的身份，客户端伪造不了。和 github.repository_owner 比一次就够。
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[发布]') ||
       contains(github.event.issue.body, '### 板块'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 解析表单，写入内容文件
        id: make
        run: node scripts/from-issue.mjs

      - name: 提交到 main
        if: steps.make.outputs.changed == 'true'
        run: |
          git config user.name 'clio'
          git config user.email 'clio@users.noreply.github.com'
          git add src/content
          git commit -F .publish-message.txt
          git push

      - name: 在 issue 里回复上线地址并关闭
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file .publish-comment.md
          gh issue close "${{ github.event.issue.number }}"

      - name: 失败时把原因写回 issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "这篇没能发布，失败原因见 [本次运行的日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。"

  build:
    needs: publish
    # publish 被跳过（push / 定时 / 手动触发）时同样要构建，所以用 always() 兜住。
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 走表单那条链路时，要拿 publish 刚推上去的那个提交；
          # 其余触发方式用本次事件对应的提交，这样在分支上手动跑也能验证。
          ref: ${{ github.event_name == 'issues' && 'main' || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 内容自检放在构建之前：一遍扫源码就行，几百毫秒的事，
      # 而它挡的是"Markdown 里混进了会在读者浏览器上执行的片段"——
      # 这种问题构建本身永远发现不了（Astro 按设计原样输出 HTML），
      # 只有扫源文件才知道。
      - run: npm run check:content
      - run: npm run build
      # 构建本身不会发现"链接拼错了"这类问题——只有点下去才知道。
      # 与其等线上 404，不如在这里拦下来。
      - run: npm run check:links
      # ★ 新仓库第一次跑到这里必定失败，而且在这一步里无解——只能手动开一次 Pages。
      #
      # 没开 Pages 时，这一步去取站点信息拿到 404，直接判死整轮运行；报错只说
      # "Get Pages site failed"，不告诉你要去哪开。而上一步的链接自检、上上步的构建
      # 都是绿的，所以症状是"日志全绿只有最后红"，极易误判成构建问题。
      #
      # 别试 enablement: true。它读起来正是解法，但只会换一个同样不知所云的错：
      # "Create Pages site failed. Error: Resource not accessible by integration"。
      # 因为创建 Pages 站点属于仓库管理操作，而 GITHUB_TOKEN 按设计永远没有管理仓库的权限——
      # permissions 支持的范围里根本没有 administration 这一项，所以在 workflow 里
      # 授予任何权限都修不好它，那个开关只对 PAT 或 GitHub App token 有效。
      #
      # 真正的修法：Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
      # 站点被创建一次之后，本文件原样工作，默认 token 永久够用。
      #
      # 上面三个 action 用 v5/v5/v6 是为了避开 Node 20 的弃用警告
      # （checkout@v4、setup-node@v4、configure-pages@v5 都还在 Node 20 上，
      # 会被强制跑在 Node 24 并打黄）。那几行黄标只是警告，不会让运行失败。
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # ★ 这个 if 不能省，它正是本站曾经"运行全绿、线上 404"的原因。
    #
    # 官方文档原文：依赖链上任意一环失败或被跳过，从该点起下游全部跳过
    # （"a failure or skip applies to all jobs in the dependency chain from
    #  the point of failure or skip onwards"）。
    # push 触发的运行里 publish 必然是 skipped（它的 if 只对 issue 事件成立），
    # 于是「跳过」沿链传下去——build 之所以还能跑，是因为它有 always()；
    # deploy 当时没写，就被一路跳过。结果：整轮显示绿色 ✓、build 里每一步也全绿，
    # 但站点从未发布，线上地址 404。
    #
    # 教训：绿色只说明"这次运行没报错"，不说明"东西上线了"。看运行结论不够，
    # 要确认 deploy 那个 job 真的执行了。
    #
    # always() 用来打破跳过传播，后面再显式要求 build 真的成功——这样 publish 失败时
    # （build 会跟着被跳过）deploy 也正确地不跑，而不是往空气里发布。
    if: always() && needs.build.result == 'success'
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署步骤返回成功，不等于地址能打开——上面那次就是这么骗过所有人的。
      # 所以这里真去请求一次，把"上线成功"变成可验证的事实。
      #
      # 两处写法是刻意的，别顺手"简化"：
      #   1. `|| true` —— run: 在 runner 上是 `bash -e`，而 curl 连接失败会返回非零，
      #      直接写 `resp=$(curl ...)` 会让整个步骤在第一轮探测就中断，重试形同虚设。
      #   2. 用 `${resp:-000}` 而不是 `|| echo 000` —— 实测 curl 会先打印 http_code
      #      再以非零退出，后者会把两段输出拼成 "200000"，把成功误判成失败。
      - name: 上线后自检
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "站点地址：$PAGE_URL"
          resp=""
          for i in $(seq 1 24); do
            resp=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$PAGE_URL" 2>/dev/null) || true
            code="${resp:-000}"
            echo "第 $i 次探测 → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✓ 线上可访问"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PAGE_URL 部署完成但仍返回 $code。多数是 Pages 站点的 Source 没选 GitHub Actions，或站点指向了别的仓库。"
          exit 1
